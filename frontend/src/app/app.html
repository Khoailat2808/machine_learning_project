@if (auth.username(); as username) {
  <mat-toolbar color="primary">
    @if (narrow()) {
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Mở menu">
        <mat-icon>menu</mat-icon>
      </button>
    }
    <span>CLV &amp; Churn</span>
    <span class="spacer"></span>
    <span class="user">{{ username }}</span>
    <button mat-icon-button (click)="auth.logout()" aria-label="Đăng xuất" title="Đăng xuất">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>
  <mat-sidenav-container>
    <mat-sidenav #sidenav [mode]="narrow() ? 'over' : 'side'" [opened]="!narrow()">
      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a mat-list-item [routerLink]="item.path" routerLinkActive #rla="routerLinkActive" [activated]="rla.isActive"
             (click)="narrow() && sidenav.close()">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.title }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <router-outlet />
}
